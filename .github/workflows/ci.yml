# The gate tiers of docs/TESTING.md, through ci/run.sh in the flake's dev shell.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  merge:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
      - run: nix develop --command ci/run.sh merge

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
      - run: nix develop --command ci/run.sh nightly
